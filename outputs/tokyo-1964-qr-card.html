<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokyo 1964 — Scan the Menu</title>
  <style>
    :root { --paper:#f4efe6; --ink:#18221e; --red:#b9472f; --orange:#e27b3c; --muted:#6e756d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:#c8d9d1; font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
    .card { width:9cm; height:14cm; padding:.72cm; background:var(--paper); border:1px solid rgba(24,34,30,.15); box-shadow:0 24px 70px rgba(24,34,30,.16); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
    .card::before { content:''; position:absolute; width:360px; height:360px; right:-180px; top:-180px; border:2px solid rgba(185,71,47,.35); border-radius:50%; box-shadow:0 0 0 28px rgba(226,123,60,.10), 0 0 0 56px rgba(185,71,47,.06); }
    .card::after { content:'TOKYO'; position:absolute; left:-68px; bottom:70px; color:rgba(185,71,47,.08); font-size:120px; font-weight:900; letter-spacing:-.08em; transform:rotate(-90deg); }
    .brand { display:flex; align-items:center; gap:12px; text-transform:uppercase; letter-spacing:.12em; font-size:12px; font-weight:800; }
    .mark { width:30px; height:30px; border:2px solid var(--red); border-radius:50%; position:relative; }
    .mark::after { content:''; position:absolute; width:7px; height:7px; left:9px; top:9px; border-radius:50%; background:var(--orange); }
    .layout { display:flex; flex-direction:column; gap:.28cm; align-items:stretch; margin-top:.35cm; position:relative; z-index:1; }
    .eyebrow { color:var(--red); font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:.22cm 0 0; font-size:1.62cm; line-height:.80; letter-spacing:-.09em; font-weight:950; text-transform:uppercase; }
    h1 span { display:block; }
    h1 .scan { color:var(--red); }
    h1 .choose { color:var(--orange); margin-left:8%; }
    h1 .enjoy { color:var(--ink); margin-left:3%; }
    .qr-wrap { width:5.35cm; align-self:center; padding:.25cm; background:#fff; border:5px solid var(--ink); box-shadow:6px 6px 0 var(--orange); }
    .qr-wrap img { display:block; width:100%; height:auto; aspect-ratio:1; }
    .scan-note { margin:14px 0 0; color:var(--muted); text-align:center; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .footer { display:flex; justify-content:space-between; gap:10px; padding-top:.2cm; border-top:1px solid rgba(24,34,30,.14); color:var(--muted); font-size:8px; text-transform:uppercase; letter-spacing:.08em; }
    .footer strong { color:var(--ink); }
    @media (max-width:650px) { body { padding:12px; } }
    @media print { @page { size:9cm 14cm; margin:0; } body { width:9cm; height:14cm; min-height:14cm; padding:0; background:#fff; } .card { width:9cm; height:14cm; box-shadow:none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Tokyo 1964</span></div>
    <div class="layout">
      <section>
        <div class="eyebrow">Tokyo 1964</div>
        <h1><span class="scan">Scan</span><span class="choose">Choose</span><span class="enjoy">Enjoy</span></h1>
      </section>
      <section class="qr-wrap">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=760x760&amp;data=https%3A%2F%2Ftokyo-nine-red.vercel.app%2F&amp;bgcolor=FFFFFF&amp;color=18221E&amp;margin=18" alt="QR code to open the Tokyo 1964 menu">
        <div class="scan-note">Scan for the menu</div>
      </section>
    </div>
    <div class="footer"><div><strong>Tokyo · Hawassa</strong></div><div>Ethiopia</div></div>
  </main>
</body>
</html>
